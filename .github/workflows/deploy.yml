# Vercel's Git integration builds and deploys on every push, but content
# edited only in Notion never produces a commit — this cron pokes a Vercel
# Deploy Hook so those edits reach production anyway.
#
# Required repository secret:
#   VERCEL_DEPLOY_HOOK — Vercel project → Settings → Git → Deploy Hooks
name: rebuild

on:
  schedule:
    # every 3 days at 21:00 UTC — picks up content edited only in Notion
    - cron: '0 21 */3 * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK secret is not set" && exit 1
          fi
          curl -fsS -X POST "$HOOK"
